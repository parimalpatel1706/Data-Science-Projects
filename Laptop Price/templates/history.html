
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction History - Laptop Price Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #007BFF;
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #007BFF;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .no-data {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #f0f0f0;
            color: #333;
        }


        a {
            display: inline-block;
            margin-top: 2rem;
            text-decoration: none;
            color: white;
            background-color: #007BFF;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #0056b3;
        }

        .home-btn {
            text-align: center;
            margin-top: 2rem;
        }

        @media (max-width: 600px) {
            th, td {
                font-size: 0.8rem;
                padding: 0.5rem;
            }

            .product-img {
                width: 80px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Prediction History</h1>
</header>

<div class="container">
    {% if historical_data %}
    <table>
        <tr>
            <th>Price (₹)</th>
            <th>Brand</th>
            <th>Processor</th>
            <th>RAM</th>
            <th>Ratings</th>
            <th>Reviews</th>
        </tr>
        {% for record in historical_data %}
        <tr>
            <td>{{ record[0] }}</td>
            <td>{{ record[1] }}</td>
            <td>{{ record[2] }}</td>
            <td>{{ record[3] }}</td>
            <td>{{ record[4] }}</td>
            <td>{{ record[5] }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p class="no-data">No predictions yet.</p>
    {% endif %}

    <div class="home-btn">
        <a href="/">← Back to Home</a>
    </div>
</div>

</body>
</html>
