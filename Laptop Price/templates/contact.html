
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Laptop Price Predictor</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      color: #333;
    }

    header {
      background-color: #007BFF;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 2rem auto;
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #007BFF;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .contact-info {
      margin-top: 1.5rem;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      text-decoration: none;
      color: white;
      background-color: #007BFF;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #0056b3;
    }

    @media (max-width: 600px) {
      .container {
        margin: 1rem;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Contact Us</h1>
  </header>

  <div class="container">
    <h2>Get in Touch</h2>
    <p>Have questions, feedback, or business inquiries?</p>
    <div class="contact-info">
      <p><strong>Email:</strong> example@example.com</p>
      <p><strong>Phone:</strong> +91 98765 43210</p>
    </div>
    <a href="/">← Back to Home</a>
  </div>

</body>
</html>
