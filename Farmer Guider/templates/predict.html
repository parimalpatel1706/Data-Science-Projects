<html>
<head>
  <title>Crop Predictor</title>
  <style>
    body { font-family: Arial; background: #ffffffff; padding: 2rem; }
    h2 { text-align: center; color: green; }
    form {
      max-width: 600px;
      margin: auto;
      padding: 2rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 1.5rem;
      background-color: green;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .result {
      text-align: center;
      margin-top: 2rem;
      font-size: 1.2rem;
      color: darkgreen;
    }
  </style>
</head>
<body>
  <h2>Crop Recommendation Form</h2>
  <form method="post">
    <label>Nitrogen (N)</label>
    <input type="number" name="N" required>

    <label>Phosphorus (P)</label>
    <input type="number" name="P" required>

    <label>Potassium (K)</label>
    <input type="number" name="K" required>

    <label>Temperature (°C)</label>
    <input type="number" step="0.01" name="temperature" required>

    <label>Humidity (%)</label>
    <input type="number" step="0.01" name="humidity" required>

    <label>pH Level</label>
    <input type="number" step="0.01" name="ph" required>

    <label>Rainfall (mm)</label>
    <input type="number" step="0.01" name="rainfall" required>

    <button type="submit">Predict</button>
  </form>

  {% if prediction %}
    <div class="result">
      <p><strong>Recommended Crop:</strong> {{ prediction }}</p>
    </div>
  {% endif %}
</body>
</html>
