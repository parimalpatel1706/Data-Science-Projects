<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Guide App</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://img.freepik.com/free-photo/green-tea-bud-leaves-green-tea-plantations-morning_335224-955.jpg?semt=ais_hybrid&w=740') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    header, footer {
      background-color: rgba(7, 119, 48, 0.8);
      text-align: center;
      padding: 1.5rem;
    }

    main {
      text-align: center;
      padding: 2rem;
      background-color: rgba(255, 255, 255, 0.85);
      color: #333;
      margin: 2rem auto;
      width: 80%;
      border-radius: 1rem;
    }

    a.button {
      background-color: green;
      color: white;
      padding: 1rem 2rem;
      margin: 1rem;
      text-decoration: none;
      border-radius: 8px;
      display: inline-block;
      transition: 0.3s;
    }

    a.button:hover {
      background-color: darkgreen;
    }
  </style>
</head>
<body>
  <header>
    <h1>Farmer Guide & Crop Prediction App</h1>
  </header>

  <main>
    <h2>Welcome to Smart Agriculture</h2>
    <p>Predict the best crop based on soil and climate data.</p>
    <a class="button" href="/predict">Start Prediction</a>
    <a class="button" href="/about">About</a>
    <a class="button" href="/contact">Contact</a>
    <a class="button" href="/history">History</a>
  </main>

  <footer>
    &copy; 2025 Farmer Guide App
  </footer>
</body>
</html>
