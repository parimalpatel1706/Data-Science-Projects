<!DOCTYPE html>
<html lang="en">
{% extends "base.html" %}
{% block title %}Contact Us - Finance Predictor{% endblock %}

{% block content %}
<div class="card">
    <h1><i class="fas fa-envelope icon"></i> Get in Touch</h1>
    <p>If you have any questions, feedback, or suggestions, feel free to contact us.</p>
    
    <form style="margin-top: 20px;">
        <label for="name">Your Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Your Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Message:</label>
        <textarea id="message" rows="4" placeholder="Write your message here..." required></textarea>

        <button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button>
    </form>
</div>
{% endblock %}
</html>
